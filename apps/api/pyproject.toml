[project]
name = "triage-api"
version = "0.1.0"
description = "HTTP API: auth, repos, scans and issues. Never calls an LLM directly."
requires-python = ">=3.12"
dependencies = [
    "triage-core",
    "triage-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.9",
    "httpx>=0.27",
]

[tool.uv.sources]
triage-core = { workspace = true }
triage-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_api"]
