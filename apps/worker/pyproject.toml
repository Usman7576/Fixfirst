[project]
name = "triage-worker"
version = "0.1.0"
description = "Background worker: claims scan jobs, runs scanners and the AI triage pipeline."
requires-python = ">=3.12"
dependencies = [
    "triage-core",
    "triage-db",
]

[tool.uv.sources]
triage-core = { workspace = true }
triage-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_worker"]
