[project]
name = "triage-db"
version = "0.1.0"
description = "SQLAlchemy models, engine/session helpers and Alembic migrations."
requires-python = ">=3.12"
dependencies = [
    "triage-core",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
]

[tool.uv.sources]
triage-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_db"]
