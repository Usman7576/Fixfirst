[project]
name = "triage-core"
version = "0.1.0"
description = "Domain models, configuration and logging shared by the API and worker."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_core"]
